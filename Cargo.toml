[workspace]
members = [
    "crates/engcode-lexer",
    "crates/engcode-parser",
    "crates/engcode-analyzer",
    "crates/engcode-runtime",
    "crates/engcode-stdlib",
    "crates/engcode-cli",
    "crates/engcode-mobile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EnglishCode Team"]
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
